services:
  db:
    image: pgvector/pgvector:pg16
    container_name: hitl-db
    environment:
      POSTGRES_USER: hitl
      POSTGRES_PASSWORD: hitl
      POSTGRES_DB: hitl
    ports:
      - "127.0.0.1:5442:5432"
    volumes:
      - hitl-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hitl -d hitl"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  hitl-db-data:
