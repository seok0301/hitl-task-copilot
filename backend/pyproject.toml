[project]
name = "hitl-backend"
version = "0.1.0"
description = "HITL multi-agent task copilot backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bcrypt>=5.0.0",
    "fastapi>=0.141.1",
    "fastembed>=0.8.1",
    "langchain-core>=1.6.5",
    "langchain-google-genai>=4.4.0",
    "langchain-openai>=1.6.6",
    "langgraph>=1.2.12",
    "langgraph-checkpoint-postgres>=3.1.2",
    "pgvector>=0.5.0",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.1.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
# B008: FastAPI Depends 관례, ISC004: 데이터 파일의 긴 문자열, DTZ011: 로컬 날짜 사용
extend-ignore = ["B008", "ISC004", "DTZ011"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: 실행 중인 DB와 seed 데이터가 필요한 테스트"]
